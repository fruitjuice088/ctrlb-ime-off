name: release

# Build ctrlb-ime-off in CI and publish it as a GitHub Release on tag push (v*).
# Every run uploads a workflow artifact; a tag additionally publishes the Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: ctrlb-ime-off.exe
            asset: ctrlb-ime-off.exe
          - os: macos-latest
            bin: ctrlb-ime-off
            asset: ctrlb-ime-off-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          rustup update stable
          rustup default stable
          cargo build --release
      - name: Rename to release asset name
        shell: bash
        run: mv "target/release/${{ matrix.bin }}" "target/release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/release/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
