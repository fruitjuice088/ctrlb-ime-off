[package]
name = "ctrlb-ime-off"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ctrlb-ime-off"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
